<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLUB BUENA VISTA - Panel de Supervisión y Control</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bv-green: #004d2e;
      --bv-gold: #c8963e;
      --bv-bg: #f4f6f8;
    }

    body {
      background-color: var(--bv-bg);
      color: #212529;
      font-family: 'Poppins', sans-serif;
    }

    .header-buenavista {
      background: linear-gradient(180deg, #005a36 0%, #004026 100%);
      border-bottom: 3px solid var(--bv-gold);
      padding: 12px 24px;
    }

    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: #ffffff;
      font-size: 1.35rem;
      margin: 0;
    }

    .brand-subtitle {
      color: var(--bv-gold);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .nav-tabs-buenavista {
      border: 1.5px solid var(--bv-gold);
      border-radius: 10px;
      background: #ffffff;
      padding: 4px;
      gap: 4px;
    }

    .nav-tabs-buenavista .nav-link {
      border: none;
      color: #475569;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 6px;
      padding: 10px 18px;
    }

    .nav-tabs-buenavista .nav-link.active {
      background-color: var(--bv-gold);
      color: #ffffff !important;
      font-weight: 700;
    }

    .bv-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .bv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .bv-table thead th {
      background-color: #212529;
      color: #ffffff;
      font-weight: 700;
      padding: 10px;
      border: 1px solid #343a40;
    }

    .bv-table tbody td {
      padding: 10px;
      border: 1px solid #cbd5e1;
      vertical-align: middle;
      background-color: #ffffff;
    }

    .bv-table tbody tr:nth-of-type(even) td {
      background-color: #f8f9fa;
    }

    .badge-estado-dentro { background-color: #ffc107; color: #000; font-weight: 700; padding: 4px 8px; border-radius: 4px; }
    .badge-estado-salida { background-color: #6c757d; color: #fff; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
    .text-cedula { color: #dc3545; font-weight: 600; }
  </style>
</head>
<body>

  <header class="header-buenavista d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <div style="width:48px; height:48px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid var(--bv-gold);">
        <i class="fa-solid fa-shield-halved text-success fs-4"></i>
      </div>
      <div>
        <h1 class="brand-title">CLUB BUENA VISTA</h1>
        <div class="brand-subtitle"><i class="fa-solid fa-trophy me-1"></i>PANEL DE SUPERVISIÓN Y CONTROL</div>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-success" id="indicadorRealtime"><i class="fa-solid fa-bolt me-1"></i>En Vivo</span>
      <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </header>

  <div class="container-fluid px-4 py-4">

    <ul class="nav nav-tabs nav-tabs-buenavista mb-4" id="pestañas" role="tablist">
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100 active" id="tab1" data-bs-toggle="tab" data-bs-target="#content1" type="button">
          <i class="fa-solid fa-list-check me-2"></i>1. Bitácora de Asistencia (Guardia)
        </button>
      </li>
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100" id="tab2" data-bs-toggle="tab" data-bs-target="#content2" type="button">
          <i class="fa-solid fa-triangle-exclamation me-2"></i>2. Bitácora de Novedades (Guardia)
        </button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- PESTAÑA 1: ASISTENCIA -->
      <div class="tab-pane fade show active" id="content1">
        <div class="bv-card">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
              <h5 class="m-0 fw-bold text-success me-2"><i class="fa-solid fa-users me-1"></i>Registros de Asistencia</h5>
              
              <input type="date" id="filtroFecha" class="form-control form-control-sm" style="width: 160px;" onchange="filtrarYRenderizar()">
              <input type="text" id="filtroTexto" class="form-control form-control-sm" placeholder="Buscar por Nombre o Cédula..." style="width: 220px;" onkeyup="filtrarYRenderizar()">
              <button class="btn btn-sm btn-outline-secondary" onclick="limpiarFiltros()"><i class="fa-solid fa-xmark me-1"></i>Ver Todo</button>
              <button class="btn btn-sm btn-outline-success" onclick="cargarTodo()"><i class="fa-solid fa-rotate me-1"></i>Actualizar</button>
            </div>
            
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-success fw-bold" onclick="exportarExcelAsistencia()"><i class="fa-solid fa-file-excel me-1"></i>Descargar Excel</button>
              <button class="btn btn-sm btn-danger fw-bold" onclick="exportarPDFAsistencia()"><i class="fa-solid fa-file-pdf me-1"></i>Descargar PDF Cuadriculado</button>
            </div>
          </div>

          <div class="table-responsive" id="areaPDFAsistencia">
            <table class="table bv-table">
              <thead>
                <tr>
                  <th>Día</th>
                  <th>Fecha / Hora Entrada</th>
                  <th>Fecha / Hora Salida</th>
                  <th>Socio / Visitante</th>
                  <th>Cédula</th>
                  <th>Destino</th>
                  <th>Observaciones</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody id="tbodyAsistencia"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- PESTAÑA 2: NOVEDADES -->
      <div class="tab-pane fade" id="content2">
        <div class="bv-card">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h5 class="fw-bold text-success mb-0"><i class="fa-solid fa-shield-cat me-2"></i>Novedades e Incidencias</h5>
            
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-success" onclick="cargarTodo()"><i class="fa-solid fa-rotate me-1"></i>Actualizar Novedades</button>
              <button class="btn btn-sm btn-success fw-bold" onclick="exportarExcelNovedades()"><i class="fa-solid fa-file-excel me-1"></i>Descargar Excel</button>
              <button class="btn btn-sm btn-danger fw-bold" onclick="exportarPDFNovedades()"><i class="fa-solid fa-file-pdf me-1"></i>Descargar PDF Cuadriculado</button>
            </div>
          </div>

          <div class="table-responsive" id="areaPDFNovedades">
            <table class="table bv-table">
              <thead>
                <tr>
                  <th>Día</th>
                  <th>Fecha / Hora</th>
                  <th>Ubicación</th>
                  <th>Asunto</th>
                  <th>Observación Guardia</th>
                  <th>Evidencia</th>
                  <th>Estado</th>
                  <th>Guardia</th>
                </tr>
              </thead>
              <tbody id="tbodyNovedades"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xyzcompany.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let datosAsistencia = [];
    let datosNovedades = [];
    const diasSemana = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    document.addEventListener("DOMContentLoaded", () => {
      cargarTodo();
      suscribirTiempoReal();
    });

    async function cargarTodo() {
      await Promise.all([cargarAsistencia(), cargarNovedades()]);
      filtrarYRenderizar();
    }

    async function cargarAsistencia() {
      try {
        const { data, error } = await _supabase.from('bitacora_asistencia').select('*').order('id', { ascending: false });
        if (error) throw error;
        datosAsistencia = data || [];
      } catch (err) {
        console.error("Error cargando Asistencias:", err);
      }
    }

    async function cargarNovedades() {
      try {
        const { data, error } = await _supabase.from('bitacora_novedades').select('*').order('id', { ascending: false });
        if (error) throw error;
        datosNovedades = data || [];
      } catch (err) {
        console.error("Error cargando Novedades:", err);
      }
    }

    function suscribirTiempoReal() {
      _supabase.channel('cambios-bitacora-supervisor')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bitacora_asistencia' }, () => cargarTodo())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bitacora_novedades' }, () => cargarTodo())
        .subscribe();
    }

    function limpiarFiltros() {
      document.getElementById('filtroFecha').value = '';
      document.getElementById('filtroTexto').value = '';
      filtrarYRenderizar();
    }

    function filtrarYRenderizar() {
      const fechaSel = document.getElementById('filtroFecha').value;
      const textoSel = document.getElementById('filtroTexto').value.toLowerCase().trim();

      const asistenciaFiltrada = datosAsistencia.filter(item => {
        const fEntradaRaw = item.fecha_hora_entrada || item.created_at || '';
        const strFecha = fEntradaRaw ? fEntradaRaw.split('T')[0] : '';
        const coincideFecha = !fechaSel || strFecha === fechaSel;
        
        const nombreSocio = (item.nombre || item.socio || item.visitante || '').toLowerCase();
        const numCedula = (item.cedula || item.documento || '').toLowerCase();
        const coincideTexto = !textoSel || nombreSocio.includes(textoSel) || numCedula.includes(textoSel);

        return coincideFecha && coincideTexto;
      });

      renderAsistencia(asistenciaFiltrada);
      renderNovedades(datosNovedades);
    }

    function renderAsistencia(lista) {
      const tbody = document.getElementById('tbodyAsistencia');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">No se encontraron registros en la bitácora de asistencia.</td></tr>`;
        return;
      }

      lista.forEach(item => {
        const rawFechaEntrada = item.fecha_hora_entrada || item.created_at;
        const d = new Date(rawFechaEntrada);
        const diaNombre = isNaN(d.getTime()) ? '-' : diasSemana[d.getDay()];
        const fEntrada = rawFechaEntrada ? new Date(rawFechaEntrada).toLocaleString('es-EC') : '-';
        const fSalida = item.fecha_hora_salida ? new Date(item.fecha_hora_salida).toLocaleString('es-EC') : null;

        const nombre = item.nombre || item.socio || item.visitante || '-';
        const cedula = item.cedula || item.documento || '-';
        const destino = item.destino || 'Instalaciones';
        const observaciones = item.observaciones || item.observacion || '-';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${diaNombre}</strong></td>
          <td>${fEntrada}</td>
          <td>${fSalida ? `<span class="badge-estado-salida">${fSalida}</span>` : '<span class="badge-estado-dentro">DENTRO DEL CLUB</span>'}</td>
          <td class="fw-bold">${nombre}</td>
          <td class="text-cedula">${cedula}</td>
          <td>${destino}</td>
          <td class="small text-muted">${observaciones}</td>
          <td>${fSalida ? '<span class="badge bg-secondary">COMPLETADO</span>' : '<span class="badge bg-warning text-dark">ACTIVO</span>'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderNovedades(lista) {
      const tbody = document.getElementById('tbodyNovedades');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">No hay novedades registradas.</td></tr>`;
        return;
      }

      lista.forEach(n => {
        const rawFecha = n.fecha_hora || n.created_at;
        const d = new Date(rawFecha);
        const diaNombre = isNaN(d.getTime()) ? '-' : diasSemana[d.getDay()];
        const fFecha = rawFecha ? new Date(rawFecha).toLocaleString('es-EC') : '-';

        const asunto = n.asunto || n.titulo || 'Novedad Garita';
        const obs = n.observacion_guardia || n.observaciones || n.descripcion || '-';
        const foto = n.foto_url || n.imagen_url || null;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${diaNombre}</strong></td>
          <td>${fFecha}</td>
          <td><span class="badge bg-danger">${n.ubicacion || 'Garita'}</span></td>
          <td class="fw-bold">${asunto}</td>
          <td class="small">${obs}</td>
          <td>${foto ? `<a href="${foto}" target="_blank" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-image"></i> Ver Foto</a>` : '-'}</td>
          <td><span class="badge bg-warning text-dark">${n.estado || 'EN PROCESO'}</span></td>
          <td><small class="text-muted">${n.guardia_registro || 'Guardia Garita'}</small></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportarExcelAsistencia() {
      const dataFormat = datosAsistencia.map(i => ({
        "Día": diasSemana[new Date(i.fecha_hora_entrada || i.created_at).getDay()] || '',
        "Fecha Entrada": (i.fecha_hora_entrada || i.created_at) ? new Date(i.fecha_hora_entrada || i.created_at).toLocaleString('es-EC') : '',
        "Fecha Salida": i.fecha_hora_salida ? new Date(i.fecha_hora_salida).toLocaleString('es-EC') : 'DENTRO DEL CLUB',
        "Socio / Visitante": i.nombre || i.socio || i.visitante,
        "Cédula": i.cedula || i.documento,
        "Destino": i.destino || 'Instalaciones',
        "Observaciones": i.observaciones || i.observacion || '-'
      }));
      const hoja = XLSX.utils.json_to_sheet(dataFormat);
      const libro = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(libro, hoja, "Asistencia");
      XLSX.writeFile(libro, `Bitacora_Asistencia.xlsx`);
    }

    function exportarPDFAsistencia() {
      html2pdf().set({
        margin: 0.3,
        filename: `Bitacora_Asistencia.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
      }).from(document.getElementById('areaPDFAsistencia')).save();
    }

    function exportarExcelNovedades() {
      const dataFormat = datosNovedades.map(n => ({
        "Día": diasSemana[new Date(n.fecha_hora || n.created_at).getDay()] || '',
        "Fecha / Hora": (n.fecha_hora || n.created_at) ? new Date(n.fecha_hora || n.created_at).toLocaleString('es-EC') : '',
        "Ubicación": n.ubicacion || 'Garita',
        "Asunto": n.asunto || n.titulo,
        "Observación Guardia": n.observacion_guardia || n.observaciones,
        "Estado": n.estado || 'EN PROCESO',
        "Guardia": n.guardia_registro || 'Guardia Garita'
      }));
      const hoja = XLSX.utils.json_to_sheet(dataFormat);
      const libro = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(libro, hoja, "Novedades");
      XLSX.writeFile(libro, `Bitacora_Novedades.xlsx`);
    }

    function exportarPDFNovedades() {
      html2pdf().set({
        margin: 0.3,
        filename: `Bitacora_Novedades.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
      }).from(document.getElementById('areaPDFNovedades')).save();
    }

    function cerrarSesion() { window.location.href = 'index.html'; }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
