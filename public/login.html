<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garita de Control - Club Buena Vista</title>
  
  <!-- Fuentes Elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-dark: #b8860b;
      --gold-light: #f3e5ab;
      --bg-cream: #f9f8f3;
      --dark-charcoal: #1a1a1a;
      --card-bg: #ffffff;
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Montserrat', sans-serif;
      color: var(--dark-charcoal);
      min-height: 100vh;
    }

    /* Header Ejecutivo con Logo */
    .brand-header {
      background: linear-gradient(135deg, #111111 0%, #222222 100%);
      border-bottom: 3px solid var(--gold-primary);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      padding: 0.8rem 2rem;
    }

    /* CONTENEDOR DEL LOGO */
    .brand-logo-container {
      height: 60px;
      width: auto;
      background: #ffffff;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--gold-primary);
    }

    .brand-logo {
      height: 100%;
      width: auto;
      object-fit: contain;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .brand-sub {
      color: var(--gold-primary);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Pestañas de Navegación */
    .custom-tabs-nav {
      background: #111111;
      border-radius: 12px;
      padding: 0.4rem;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .custom-tabs-nav .nav-link {
      color: #cccccc;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .custom-tabs-nav .nav-link:hover {
      color: var(--gold-primary);
    }

    .custom-tabs-nav .nav-link.active {
      background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
      color: #111111;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
    }

    /* Tarjetas de Trabajo */
    .vip-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid #e5e0d8;
      box-shadow: 0 8px 25px rgba(0,0,0,0.04);
      padding: 2rem;
    }

    .panel-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--dark-charcoal);
      border-bottom: 2px solid var(--gold-light);
      padding-bottom: 0.6rem;
    }

    .form-label-custom {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 0.4rem;
    }

    .form-control-custom, .form-select-custom {
      border: 1.5px solid #dcd6cd;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      background-color: #faf9f6;
    }

    .form-control-custom:focus, .form-select-custom:focus {
      border-color: var(--gold-primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }

    /* Botones Dorado Imperial */
    .btn-vip-gold {
      background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
      color: #111111;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 0.75rem 1.8rem;
      border-radius: 8px;
      border: none;
      box-shadow: 0 4px 12px rgba(184, 134, 11, 0.3);
      transition: all 0.25s ease;
    }

    .btn-vip-gold:hover {
      background: linear-gradient(135deg, #b8860b 0%, #8b6508 100%);
      color: #ffffff;
    }

    /* Tabla Estilo Dorado */
    .table-vip {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
    }

    .table-vip thead th {
      background-color: #111111;
      color: var(--gold-primary);
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      padding: 0.9rem;
      border: none;
    }

    .table-vip tbody tr {
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .table-vip td {
      padding: 0.9rem;
      vertical-align: middle;
      border-top: 1px solid #f0ece1;
      border-bottom: 1px solid #f0ece1;
    }

    .badge-socio { background-color: #fef3c7; color: #92400e; font-weight: 700; }
    .badge-novedad { background-color: #fee2e2; color: #991b1b; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Header Superior con Espacio para el Logo -->
  <header class="brand-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      
      <!-- AQUÍ SE RENDERIZA EL LOGO -->
      <div class="brand-logo-container">
        <img src="logo.png" alt="Buena Vista Logo" class="brand-logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
        <i id="logo-fallback" class="bi bi-trophy-fill text-warning fs-3 px-2" style="display:none;"></i>
      </div>

      <div>
        <div class="brand-title">BUENA VISTA</div>
        <div class="brand-sub">Club de Tenis — Garita de Control</div>
      </div>
    </div>

    <button class="btn btn-outline-light btn-sm px-3 rounded-2" onclick="cerrarSesion()">
      <i class="bi bi-box-arrow-right me-1"></i> Salir
    </button>
  </header>

  <main class="container my-4">
    
    <!-- Pestañas de Navegación -->
    <ul class="nav nav-pills custom-tabs-nav mb-4 nav-justified" id="pills-tab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="tab-asistencia-btn" data-bs-toggle="pill" data-bs-target="#panel-asistencia" type="button">
          <i class="bi bi-person-check-fill me-2"></i>1. Asistencia de Socios
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-novedades-btn" data-bs-toggle="pill" data-bs-target="#panel-novedades" type="button">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>2. Novedades e Infraestructura
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-bitacora-btn" data-bs-toggle="pill" data-bs-target="#panel-bitacora" type="button" onclick="cargarBitacora()">
          <i class="bi bi-journal-text me-2"></i>3. Visualización de Bitácora
        </button>
      </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
      
      <!-- PESTAÑA 1 -->
      <div class="tab-pane fade show active" id="panel-asistencia" role="tabpanel">
        <div class="vip-card">
          <h5 class="panel-title mb-4"><i class="bi bi-person-badge text-warning me-2"></i>Registro de Ingreso de Socios y Visitantes</h5>
          <form id="formAsistencia" onsubmit="guardarAsistencia(event)">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label-custom">Tipo de Visita</label>
                <select class="form-select form-select-custom" id="asi_tipo" required>
                  <option value="Socio">Socio</option>
                  <option value="Invitado">Invitado</option>
                  <option value="Proveedor">Proveedor</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label-custom">Placa / Vehículo</label>
                <input type="text" class="form-control form-control-custom" id="asi_placa" placeholder="Ej: JHY-5677" required>
              </div>
              <div class="col-md-4">
                <label class="form-label-custom">Cédula / Pasaporte</label>
                <input type="text" class="form-control form-control-custom" id="asi_cedula" placeholder="1722731898" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Nombre Completo</label>
                <input type="text" class="form-control form-control-custom" id="asi_nombre" placeholder="Nombre y apellido" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Destino / Área del Club</label>
                <input type="text" class="form-control form-control-custom" id="asi_destino" placeholder="Ej: Canchas de Tenis N° 2" required>
              </div>
              <div class="col-12">
                <label class="form-label-custom">Observaciones</label>
                <textarea class="form-control form-control-custom" id="asi_obs" rows="2" placeholder="Notas de ingreso..."></textarea>
              </div>
              <div class="col-12 text-end mt-4">
                <button type="submit" class="btn btn-vip-gold">
                  <i class="bi bi-check-circle-fill me-2"></i>Guardar e Registrar Ingreso
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- PESTAÑA 2 -->
      <div class="tab-pane fade" id="panel-novedades" role="tabpanel">
        <div class="vip-card">
          <h5 class="panel-title mb-4"><i class="bi bi-tools text-warning me-2"></i>Reporte Operativo de Novedades</h5>
          <form id="formNovedad" onsubmit="guardarNovedad(event)">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label-custom">Ubicación Exacta</label>
                <input type="text" class="form-control form-control-custom" id="nov_ubicacion" placeholder="Ej: Patio 3 / Lado de canchas" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Asunto de la Novedad</label>
                <input type="text" class="form-control form-control-custom" id="nov_titulo" placeholder="Ej: Lámpara dañada" required>
              </div>
              <div class="col-12">
                <label class="form-label-custom">Detalle Explicativo</label>
                <textarea class="form-control form-control-custom" id="nov_detalle" rows="3" placeholder="Ej: Se dañó la lámpara, necesita reemplazo inmediato por falta de luz..." required></textarea>
              </div>
              <div class="col-12">
                <label class="form-label-custom">Referencia / Imagen Adjunta</label>
                <input type="text" class="form-control form-control-custom" id="nov_foto" placeholder="Nombre o nota de archivo (Ej: Foto_Lampara_Patio3.jpg)">
              </div>
              <div class="col-12 text-end mt-4">
                <button type="submit" class="btn btn-vip-gold">
                  <i class="bi bi-send-fill me-2"></i>Enviar Reporte
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- PESTAÑA 3 -->
      <div class="tab-pane fade" id="panel-bitacora" role="tabpanel">
        <div class="vip-card">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h5 class="panel-title border-0 pb-0 mb-1"><i class="bi bi-journal-bookmark-fill text-warning me-2"></i>Historial de Bitácora Digital</h5>
              <small class="text-muted">Registro en tiempo real del club</small>
            </div>
            <button class="btn btn-outline-dark btn-sm px-3 rounded-2 fw-bold" onclick="cargarBitacora()">
              <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
            </button>
          </div>

          <div class="table-responsive">
            <table class="table table-vip">
              <thead>
                <tr>
                  <th>Fecha/Hora</th>
                  <th>Tipo</th>
                  <th>Nombre / Asunto</th>
                  <th>Placa / Sector</th>
                  <th>Destino</th>
                  <th>Observación</th>
                </tr>
              </thead>
              <tbody id="tablaBitacora">
                <tr><td colspan="6" class="text-center text-muted py-4">Cargando registros...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js?v=2.1"></script>

  <script>
    async function guardarAsistencia(e) {
      e.preventDefault();
      try {
        const datos = {
          tipo_visita: document.getElementById('asi_tipo').value,
          placa: document.getElementById('asi_placa').value,
          cedula: document.getElementById('asi_cedula').value,
          nombre: document.getElementById('asi_nombre').value,
          destino: document.getElementById('asi_destino').value,
          observacion: document.getElementById('asi_obs').value,
          fecha_ingreso: new Date().toISOString()
        };

        const { error } = await window.supabaseClient.from('bitacora').insert([datos]);
        if (error) throw error;

        alert('¡Ingreso registrado exitosamente!');
        document.getElementById('formAsistencia').reset();
      } catch (err) {
        alert('Error al registrar: ' + err.message);
      }
    }

    async function guardarNovedad(e) {
      e.preventDefault();
      try {
        const datos = {
          tipo_visita: 'NOVEDAD',
          placa: document.getElementById('nov_ubicacion').value,
          nombre: document.getElementById('nov_titulo').value,
          observacion: document.getElementById('nov_detalle').value,
          destino: document.getElementById('nov_foto').value || 'Sin Evidencia',
          fecha_ingreso: new Date().toISOString()
        };

        const { error } = await window.supabaseClient.from('bitacora').insert([datos]);
        if (error) throw error;

        alert('¡Novedad registrada exitosamente!');
        document.getElementById('formNovedad').reset();
      } catch (err) {
        alert('Error al guardar novedad: ' + err.message);
      }
    }

    async function cargarBitacora() {
      const tbody = document.getElementById('tablaBitacora');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Cargando bitácora...</td></tr>';
      
      try {
        const { data, error } = await window.supabaseClient
          .from('bitacora')
          .select('*')
          .order('fecha_ingreso', { ascending: false })
          .limit(20);

        if (error) throw error;

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Sin registros.</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(r => `
          <tr>
            <td><small class="text-muted fw-semibold">${new Date(r.fecha_ingreso || r.created_at).toLocaleString()}</small></td>
            <td>
              <span class="badge ${r.tipo_visita === 'NOVEDAD' ? 'badge-novedad' : 'badge-socio'} rounded-pill px-3 py-2">
                ${r.tipo_visita || 'Ingreso'}
              </span>
            </td>
            <td><strong>${r.nombre || 'N/A'}</strong></td>
            <td><code class="bg-light text-dark px-2 py-1 rounded border">${r.placa || 'N/A'}</code></td>
            <td><small>${r.destino || 'Garita'}</small></td>
            <td>${r.observacion || 'Sin detalles'}</td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Error: ${err.message}</td></tr>`;
      }
    }

    function cerrarSesion() {
      sessionStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
