<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLUB BUENA VISTA - Panel de Supervisión</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bv-green: #004d2e;
      --bv-gold: #c8963e;
      --bv-bg: #f4f6f8;
    }

    body {
      background-color: var(--bv-bg);
      color: #212529;
      font-family: 'Poppins', sans-serif;
    }

    .header-buenavista {
      background: linear-gradient(180deg, #005a36 0%, #004026 100%);
      border-bottom: 3px solid var(--bv-gold);
      padding: 12px 24px;
    }

    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: #ffffff;
      font-size: 1.35rem;
      margin: 0;
    }

    .brand-subtitle {
      color: var(--bv-gold);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .nav-tabs-buenavista {
      border: 1.5px solid var(--bv-gold);
      border-radius: 10px;
      background: #ffffff;
      padding: 4px;
      gap: 4px;
    }

    .nav-tabs-buenavista .nav-link {
      border: none;
      color: #475569;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 6px;
      padding: 10px 18px;
    }

    .nav-tabs-buenavista .nav-link.active {
      background-color: var(--bv-gold);
      color: #ffffff !important;
      font-weight: 700;
    }

    .bv-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    /* Tabla Cuadriculada Estilizada */
    .bv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .bv-table thead th {
      background-color: #212529;
      color: #ffffff;
      font-weight: 700;
      padding: 10px;
      border: 1px solid #343a40;
    }

    .bv-table tbody td {
      padding: 10px;
      border: 1px solid #cbd5e1;
      vertical-align: middle;
      background-color: #ffffff;
    }

    .bv-table tbody tr:nth-of-type(even) td {
      background-color: #f8f9fa;
    }

    .badge-estado-dentro {
      background-color: #ffc107;
      color: #000000;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
    }

    .badge-estado-salida {
      background-color: #6c757d;
      color: #ffffff;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
    }

    .text-cedula {
      color: #dc3545;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header class="header-buenavista d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <div style="width:48px; height:48px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid var(--bv-gold);">
        <i class="fa-solid fa-shield-halved text-success fs-4"></i>
      </div>
      <div>
        <h1 class="brand-title">CLUB BUENA VISTA</h1>
        <div class="brand-subtitle"><i class="fa-solid fa-trophy me-1"></i>PANEL DE SUPERVISIÓN Y CONTROL</div>
      </div>
    </div>
    <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
  </header>

  <div class="container-fluid px-4 py-4">

    <!-- Navegación de Pestañas -->
    <ul class="nav nav-tabs nav-tabs-buenavista mb-4" id="pestañas" role="tablist">
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100 active" id="tab1" data-bs-toggle="tab" data-bs-target="#content1" type="button">
          <i class="fa-solid fa-list-check me-2"></i>1. Bitácora de Asistencia
        </button>
      </li>
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100" id="tab2" data-bs-toggle="tab" data-bs-target="#content2" type="button">
          <i class="fa-solid fa-triangle-exclamation me-2"></i>2. Bitácora de Novedades
        </button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- PESTAÑA 1: BITÁCORA DE ASISTENCIA -->
      <div class="tab-pane fade show active" id="content1">
        <div class="bv-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center gap-3">
              <h5 class="m-0 fw-bold text-success"><i class="fa-solid fa-users me-2"></i>Registros de Asistencia</h5>
              <select id="filtroDia" class="form-select form-select-sm" style="width: 170px;" onchange="filtrarYRenderizar()">
                <option value="TODOS">Todos los días</option>
                <option value="1">Lunes</option>
                <option value="2">Martes</option>
                <option value="3">Miércoles</option>
                <option value="4">Jueves</option>
                <option value="5">Viernes</option>
                <option value="6">Sábado</option>
                <option value="0">Domingo</option>
              </select>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-success fw-bold" onclick="exportarExcel()"><i class="fa-solid fa-file-excel me-1"></i>Descargar Excel</button>
              <button class="btn btn-sm btn-danger fw-bold" onclick="exportarPDF()"><i class="fa-solid fa-file-pdf me-1"></i>Descargar PDF Cuadriculado</button>
            </div>
          </div>

          <div class="table-responsive" id="areaPDF">
            <table class="table bv-table">
              <thead>
                <tr>
                  <th>Día</th>
                  <th>Fecha / Hora Entrada</th>
                  <th>Fecha / Hora Salida</th>
                  <th>Socio / Visitante</th>
                  <th>Cédula</th>
                  <th>Destino</th>
                  <th>Observaciones</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody id="tbodyAsistencia"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- PESTAÑA 2: BITÁCORA DE NOVEDADES -->
      <div class="tab-pane fade" id="content2">
        <div class="bv-card">
          <h5 class="fw-bold text-success mb-3"><i class="fa-solid fa-shield-cat me-2"></i>Novedades e Incidencias</h5>
          <div class="table-responsive">
            <table class="table bv-table">
              <thead>
                <tr>
                  <th>Día</th>
                  <th>Fecha / Hora</th>
                  <th>Ubicación</th>
                  <th>Asunto</th>
                  <th>Observación Guardia</th>
                  <th>Evidencia</th>
                  <th>Estado</th>
                  <th>Respuesta Supervisor</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="tbodyNovedades"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xyzcompany.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let registrosBase = [];
    const diasSemana = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    document.addEventListener("DOMContentLoaded", cargarDatos);

    async function cargarDatos() {
      try {
        const { data, error } = await _supabase.from('bitacora').select('*').order('id', { ascending: false });
        if (error) throw error;
        registrosBase = data || [];
        filtrarYRenderizar();
      } catch (err) {
        console.error("Error cargando bitácora:", err);
      }
    }

    function filtrarYRenderizar() {
      const filtro = document.getElementById('filtroDia').value;
      
      let filtrados = registrosBase;
      if (filtro !== 'TODOS') {
        filtrados = registrosBase.filter(i => {
          const fechaRef = i.fecha_entrada || i.fecha_hora_ingreso || i.fecha;
          const d = new Date(fechaRef);
          return d.getDay().toString() === filtro;
        });
      }

      renderAsistencia(filtrados);
      renderNovedades(filtrados);
    }

    function renderAsistencia(lista) {
      const tbody = document.getElementById('tbodyAsistencia');
      tbody.innerHTML = '';

      lista.forEach(item => {
        const strFechaEntrada = item.fecha_entrada || item.fecha_hora_ingreso || item.fecha;
        const strFechaSalida = item.fecha_salida || item.fecha_hora_salida;
        const d = new Date(strFechaEntrada);
        const diaNombre = isNaN(d.getTime()) ? '-' : diasSemana[d.getDay()];

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${diaNombre}</strong></td>
          <td>${strFechaEntrada || '-'}</td>
          <td>${strFechaSalida ? `<span class="badge-estado-salida">${strFechaSalida}</span>` : '<span class="badge-estado-dentro">DENTRO DEL CLUB</span>'}</td>
          <td class="fw-bold">${item.nombre || item.socio || 'SIN REGISTRO'}</td>
          <td class="text-cedula">${item.cedula || 'N/A'}</td>
          <td>${item.destino || 'Instalaciones'}</td>
          <td class="small text-muted">${item.observaciones || item.detalle_observacion || '-'}</td>
          <td>${strFechaSalida ? '<span class="badge bg-secondary">COMPLETADO</span>' : '<span class="badge bg-warning text-dark">ACTIVO</span>'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderNovedades(lista) {
      const tbody = document.getElementById('tbodyNovedades');
      tbody.innerHTML = '';

      const novedades = lista.filter(i => i.asunto_novedad || i.novedades);

      novedades.forEach(n => {
        const strFecha = n.fecha_entrada || n.fecha;
        const d = new Date(strFecha);
        const diaNombre = isNaN(d.getTime()) ? '-' : diasSemana[d.getDay()];

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${diaNombre}</strong></td>
          <td>${strFecha || '-'}</td>
          <td><span class="badge bg-danger">${n.ubicacion || 'Garita'}</span></td>
          <td class="fw-bold">${n.asunto_novedad || n.novedades}</td>
          <td class="small">${n.detalle_observacion || n.observaciones || '-'}</td>
          <td>${n.foto_url ? `<a href="${n.foto_url}" target="_blank" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-image"></i> Ver</a>` : '-'}</td>
          <td><span class="badge bg-warning text-dark">${n.estado_resolucion || 'EN PROCESO'}</span></td>
          <td class="small">${n.observacion_supervisor || '<em>Pendiente</em>'}</td>
          <td><button class="btn btn-sm btn-warning fw-bold">Atender</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportarExcel() {
      const dataFormat = registrosBase.map(i => ({
        "Día": diasSemana[new Date(i.fecha_entrada || i.fecha).getDay()] || '',
        "Fecha Entrada": i.fecha_entrada || i.fecha_hora_ingreso || '',
        "Fecha Salida": i.fecha_salida || i.fecha_hora_salida || 'DENTRO DEL CLUB',
        "Socio / Visitante": i.nombre || i.socio || '',
        "Cédula": i.cedula || '',
        "Destino": i.destino || '',
        "Observaciones": i.observaciones || ''
      }));

      const hoja = XLSX.utils.json_to_sheet(dataFormat);
      const libro = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(libro, hoja, "Bitacora");
      XLSX.writeFile(libro, "Bitacora_Asistencia_ClubBuenaVista.xlsx");
    }

    function exportarPDF() {
      const elemento = document.getElementById('areaPDF');
      html2pdf().set({
        margin: 0.3,
        filename: 'Bitacora_Asistencia_Cuadriculada.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
      }).from(elemento).save();
    }

    function cerrarSesion() { window.location.href = 'index.html'; }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
