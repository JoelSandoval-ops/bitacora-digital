<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora - Club Buena Vista</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="mb-4 text-center">Bitácora Digital - Club Buena Vista</h2>

    <!-- Formulario de Registro (Guardia) -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">Registrar Nuevo Ingreso</div>
      <div class="card-body">
        <form id="formIngreso">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Tipo de Visita</label>
              <select class="form-select" id="tipo_visita" required>
                <option value="Socio">Socio</option>
                <option value="Invitado">Invitado</option>
                <option value="Proveedor">Proveedor</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Cédula</label>
              <input type="text" class="form-control" id="cedula" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Placa / Vehículo</label>
              <input type="text" class="form-control" id="placa">
            </div>
            <div class="col-md-4">
              <label class="form-label">Destino / Áreas</label>
              <input type="text" class="form-control" id="destino" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Fotografía</label>
              <input type="file" class="form-control" id="foto" accept="image/*" capture="environment">
            </div>
          </div>
          <button type="submit" class="btn btn-success mt-3 w-100">Guardar Registro</button>
        </form>
      </div>
    </div>

    <!-- Tabla y Exportación (Admin) -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span>Histórico de Ingresos</span>
        <a href="/api/exportar-excel" class="btn btn-sm btn-outline-light">Descargar Excel</a>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Fecha/Hora</th>
                <th>Tipo</th>
                <th>Nombre</th>
                <th>Cédula</th>
                <th>Placa</th>
                <th>Destino</th>
              </tr>
            </thead>
            <tbody id="tablaBitacora"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api/bitacora';

    // Cargar la lista desde el servidor
    async function cargarRegistros() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const tbody = document.getElementById('tablaBitacora');
        tbody.innerHTML = data.map(r => `
          <tr>
            <td>${new Date(r.hora_ingreso).toLocaleString()}</td>
            <td><span class="badge bg-secondary">${r.tipo_visita}</span></td>
            <td>${r.nombre}</td>
            <td>${r.cedula}</td>
            <td>${r.placa || 'N/A'}</td>
            <td>${r.destino}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error("Error cargando registros:", err);
      }
    }

    // Enviar nuevo registro al presionar el botón
    document.getElementById('formIngreso').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nuevoIngreso = {
        tipo_visita: document.getElementById('tipo_visita').value,
        nombre: document.getElementById('nombre').value,
        cedula: document.getElementById('cedula').value,
        placa: document.getElementById('placa').value,
        destino: document.getElementById('destino').value
      };

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(nuevoIngreso)
      });

      if (res.ok) {
        alert('¡Ingreso registrado con éxito!');
        document.getElementById('formIngreso').reset();
        cargarRegistros();
      } else {
        alert('Error al guardar el registro');
      }
    });

    cargarRegistros();
  </script>
</body>
</html>
