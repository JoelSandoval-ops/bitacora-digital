<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Buena Vista - Iniciar Sesión</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    body {
      background: #0F3822;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
    }
    .card-login {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
    }
    .brand-title {
      color: #D4AF37;
      font-family: Georgia, serif;
      font-weight: bold;
    }
    .btn-gold {
      background-color: #D4AF37;
      color: #0F3822;
      font-weight: bold;
      border: none;
    }
    .btn-gold:hover {
      background-color: #c49f2f;
      color: #0F3822;
    }
    .form-control {
      background: rgba(255, 255, 255, 0.9);
      border: none;
    }
    .form-control:focus {
      box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.5);
    }
  </style>

  <!-- Verificación rápida de sesión previa -->
  <script>
    const sesion = localStorage.getItem('user_bv');
    if (sesion) {
      try {
        const user = JSON.parse(sesion);
        const rol = (user.rol || '').toUpperCase();
        if (rol === 'ADMIN' || rol === 'ADMINISTRADOR') window.location.href = './administrador.html';
        else if (rol === 'SUPERVISOR') window.location.href = './supervisor.html';
        else if (rol === 'GUARDIA' || rol === 'GARITA') window.location.href = './guardia.html';
      } catch (e) {
        localStorage.removeItem('user_bv');
      }
    }
  </script>
</head>
<body>

  <div class="card card-login p-4 shadow-lg m-3">
    <div class="text-center mb-4">
      <h2 class="brand-title h3 mb-1">CLUB BUENA VISTA</h2>
      <p class="text-light opacity-75 small">Control de Acceso y Seguridad</p>
    </div>

    <!-- Alerta de Error -->
    <div id="errorMessage" class="alert alert-danger py-2 small" style="display: none;" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="usuario" class="form-label text-light small fw-semibold">Usuario / Correo</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-0"><i class="bi bi-person-fill text-dark"></i></span>
          <input type="text" class="form-control" id="usuario" placeholder="Ej. juanperez" required autocomplete="username">
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label text-light small fw-semibold">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-0"><i class="bi bi-lock-fill text-dark"></i></span>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-gold w-100 py-2 mb-2">
        Ingresar <i class="bi bi-box-arrow-in-right ms-1"></i>
      </button>
    </form>

    <div class="text-center mt-3">
      <small class="text-white-50">&copy; Quito, Ecuador - Buena Vista</small>
    </div>
  </div>

  <!-- JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  
  <!-- Módulo Login vinculado a Supabase -->
  <script type="module" src="./login.js"></script>
</body>
</html>
